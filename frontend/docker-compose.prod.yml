name: vps-frontend

services:
  frontend:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3001:3000"
    # NOTE: NEXT_PUBLIC_* values are inlined at BUILD time (from .env.production
    # baked into the builder stage) — setting them as runtime env here does
    # nothing and previously pointed at a dead host. The runtime image needs no
    # frontend env; the rewrite proxy target (BUNK_API_URL) is a build arg.
