name: CI – Lint & Type check

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  lint:
    name: ESLint + TypeScript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
