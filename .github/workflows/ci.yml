name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: Go agent (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  control_plane:
    name: Elixir control plane (compile + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control_plane

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/control_plane_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Restore deps + _build cache
        uses: actions/cache@v4
        with:
          path: |
            control_plane/deps
            control_plane/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('control_plane/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
