name: CD – Deploy to production
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── SAST: static code analysis before deployment ──
  sast:
    name: SAST – Static code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run SAST with Semgrep
        run: |
          semgrep scan --config=auto --error --json --output=semgrep-results.json src/
        continue-on-error: false

      - name: Display SAST results
        if: always()
        run: |
          echo "SAST scan completed."
          cat semgrep-results.json || true

  # ── DEPLOY: only runs if SAST passes ──
  deploy:
    name: Deploy frontend
    runs-on: self-hosted
    needs: sast
    steps:
      - name: Pull latest code (fail-fast bij silent error)
        run: |
          set -euo pipefail
          cd ~/vps-frontend
          # Eigendomsproblemen op .git oplossen — voorkomt "Permission denied"
          # op refs door een eerdere sudo-aanroep.
          if [ -d .git ]; then
            sudo -n chown -R "$(id -u)":"$(id -g)" .git 2>/dev/null || \
              echo "Geen sudo-rechten voor chown; sla over"
          fi
          # Zelf-helend: ruim stale remote-refs op die "fatal: bad object"
          # veroorzaken na branch auto-delete bij PR-merge.
          git remote prune origin 2>/dev/null || true
          if ! git fetch --prune origin main; then
            echo "Fetch faalde - corrupte refs opruimen en opnieuw proberen"
            rm -rf .git/refs/remotes/origin
            rm -f .git/packed-refs
            git fetch --prune origin main
          fi
          git reset --hard origin/main
          # Verifieer dat we daadwerkelijk op origin/main zitten — een silent
          # reset-failure (door rechten) zou anders met OUDE code doorgaan.
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "FOUT: HEAD ($LOCAL) komt niet overeen met origin/main ($REMOTE)" >&2
            exit 1
          fi
          echo "Werkboom is up-to-date met origin/main: $LOCAL"

      - name: Build Docker image
        run: |
          set -euo pipefail
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml build

      - name: Restart frontend
        run: |
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml up -d --force-recreate

      - name: Wait for healthy frontend
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsSL -o /dev/null -w '%{http_code}' http://localhost:3001/ 2>/dev/null | grep -qE '200|307'; then
              echo "Frontend is healthy"
              break
            fi
            echo "Waiting for frontend... ($i/12)"
            sleep 5
            if [ "$i" = "12" ]; then
              echo "Health check failed!"
              cd ~/vps-frontend
              docker compose -f docker-compose.prod.yml logs --tail=20
              exit 1
            fi
          done

      - name: Smoke test — kritieke routes
        run: |
          # Vangt het geval dat / werkt maar /login/dashboard 404 geeft door
          # een stale build (zoals 21-05 incident waar de site april-build draaide).
          set -euo pipefail
          FAILED=0
          for path in / /login /register /forgot-password /robots.txt /ai.txt; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "http://localhost:3001$path" 2>/dev/null || echo "000")
            # /robots.txt en /ai.txt mogen 200 zijn; pagina-routes 200 of 307 (auth redirect)
            case "$path" in
              /robots.txt|/ai.txt)
                expected="200" ;;
              *)
                expected="200|307|308" ;;
            esac
            if echo "$code" | grep -qE "^($expected)$"; then
              echo "  OK   $path → $code"
            else
              echo "  FAIL $path → $code (verwacht $expected)" >&2
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "Smoke-test mislukt — kritieke routes zijn niet correct"
            cd ~/vps-frontend
            docker compose -f docker-compose.prod.yml logs --tail=40
            exit 1
          fi
          echo "Smoke-test: alle kritieke routes OK"

  # ── DAST: dynamic scan after the app is running ──
  # Runs on self-hosted because it needs to reach localhost:3001.
  dast:
    name: DAST – Dynamic scan
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Wait for frontend to stabilize
        run: sleep 10

      - name: Pull OWASP ZAP image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p /tmp/zap-reports
          docker run --rm \
            --network host \
            --user $(id -u):$(id -g) \
            -v /tmp/zap-reports:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:3001 \
              -r zap-report.html \
              -J zap-report.json \
              -I
        continue-on-error: true

      - name: Display ZAP summary
        run: |
          echo "DAST scan completed."
          cat /tmp/zap-reports/zap-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          sites = data.get('site', [])
          for site in sites:
              alerts = site.get('alerts', [])
              print(f'Alerts found: {len(alerts)}')
              for alert in alerts:
                  risk = alert.get('riskdesc', 'Unknown')
                  name = alert.get('name', 'Unknown')
                  print(f'  [{risk}] {name}')
          " || echo "Could not parse report"

      - name: Block on high risk findings
        run: |
          HIGH=$(cat /tmp/zap-reports/zap-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          count = 0
          for site in data.get('site', []):
              for alert in site.get('alerts', []):
                  if alert.get('riskcode') == '3':
                      count += 1
          print(count)
          " 2>/dev/null || echo "0")

          echo "High risk findings: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "High risk vulnerabilities found! Pipeline failed."
            exit 1
          fi
          echo "No high risk vulnerabilities found."
