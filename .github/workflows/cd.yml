name: CD – Deploy to production
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── SAST: static code analysis before deployment ──
  sast:
    name: SAST – Static code analysis
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/vps-frontend
          git fetch origin main
          git reset --hard origin/main

      - name: Run SAST with Semgrep (Docker)
        run: |
          cd ~/vps-frontend
          docker run --rm \
            -v $(pwd):/src \
            returntocorp/semgrep:latest \
            semgrep scan --config=auto --error --json --output=/src/semgrep-results.json
        continue-on-error: false

      - name: Display SAST results
        if: always()
        run: |
          echo "SAST scan completed."
          cd ~/vps-frontend
          cat semgrep-results.json || true

  # ── DEPLOY: only runs if SAST passes ──
  deploy:
    name: Deploy frontend
    runs-on: self-hosted
    needs: sast
    steps:
      - name: Pull latest code
        run: |
          cd ~/vps-frontend
          git fetch origin main
          git reset --hard origin/main

      - name: Build Docker image
        run: |
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml build

      - name: Restart frontend
        run: |
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml up -d --force-recreate

      - name: Wait for healthy frontend
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL -o /dev/null -w '%{http_code}' http://localhost:3001/ 2>/dev/null | grep -qE '200|307'; then
              echo "Frontend is healthy"
              exit 0
            fi
            echo "Waiting for frontend... ($i/12)"
            sleep 5
          done
          echo "Health check failed!"
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml logs --tail=20
          exit 1

  # ── DAST: dynamic scan after the app is running ──
  dast:
    name: DAST – Dynamic scan
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Wait for frontend to stabilize
        run: sleep 10

      - name: Pull OWASP ZAP image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Create ZAP reports directory
        run: |
          sudo mkdir -p ~/zap-reports
          sudo chown -R $(id -u):$(id -g) ~/zap-reports
          sudo chmod 755 ~/zap-reports

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            --network host \
            --user $(id -u):$(id -g) \
            -v ~/zap-reports:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:3001 \
              -r zap-report.html \
              -J zap-report.json \
              -I
        continue-on-error: true

      - name: Display ZAP summary
        run: |
          echo "DAST scan completed."
          cat ~/zap-reports/zap-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          sites = data.get('site', [])
          for site in sites:
              alerts = site.get('alerts', [])
              print(f'Alerts found: {len(alerts)}')
              for alert in alerts:
                  risk = alert.get('riskdesc', 'Unknown')
                  name = alert.get('name', 'Unknown')
                  print(f'  [{risk}] {name}')
          " || echo "Could not parse report"

      - name: Block on high risk findings
        run: |
          HIGH=$(cat ~/zap-reports/zap-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          count = 0
          for site in data.get('site', []):
              for alert in site.get('alerts', []):
                  if alert.get('riskcode') == '3':
                      count += 1
          print(count)
          " 2>/dev/null || echo "0")

          echo "Number of high risk findings: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "High risk vulnerabilities found! Pipeline failed."
            exit 1
          fi
          echo "No high risk vulnerabilities found."
