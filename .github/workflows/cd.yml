name: CD – Deploy naar productie

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy frontend
    runs-on: self-hosted

    steps:
      - name: Pull laatste code
        run: |
          cd ~/vps-frontend
          git fetch origin main
          git reset --hard origin/main

      - name: Build Docker image
        run: |
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml build

      - name: Herstart frontend
        run: |
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml up -d --force-recreate

      - name: Wacht op gezonde frontend
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL -o /dev/null -w '%{http_code}' http://localhost:3001/ 2>/dev/null | grep -qE '200|307'; then
              echo "Frontend is healthy"
              exit 0
            fi
            echo "Wachten op frontend... ($i/12)"
            sleep 5
          done
          echo "Health check mislukt!"
          cd ~/vps-frontend
          docker compose -f docker-compose.prod.yml logs --tail=20
          exit 1
