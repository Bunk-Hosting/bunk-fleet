map $http_upgrade $conn_upgrade { default upgrade; '' close; }

# Trust CF-Connecting-IP ONLY when the request actually arrives from a published
# Cloudflare edge address; otherwise a direct client could spoof its IP and defeat
# the control plane's rate-limiting/audit. realip rewrites $remote_addr to the
# verified client IP, which we forward below (never the raw client-supplied header).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Rate-limit zone for credential/enrollment endpoints (keyed on the verified IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  # Reject oversized bodies before they reach the control plane.
  client_max_body_size 2m;

  # Defence-in-depth security headers (the app also sets its own on HTML routes).
  # Security headers live here and only here. They used to be set twice — once
  # by nginx and once by next.config.mjs — which is how a policy drifts: you
  # change one, the other keeps answering. The edge is the single ingress for
  # both the app and the API, so it is the only layer that can cover everything;
  # Next now sets nothing but the CSP, which is HTML-specific.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # In-browser console: WebSocket -> control plane
  location /ws/ {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Customer/API traffic -> control plane (direct; no Next rewrite hop)
  location /api/v1/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }

  # Worker onboarding -> control plane: the install wizard (curl | bash), the
  # agent binary it downloads, and the node API (enroll/heartbeat/commands) that
  # an external worker VM calls. Without these an off-host worker install 404s.
  location = /install.sh {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dist/ {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Node API: enrol, heartbeat, command poll — and the console relay, which is a
  # WebSocket, so this location has to carry the upgrade through. Without the two
  # Upgrade headers the agent's dial-back gets a 400 and every console on a remote
  # node fails with nothing in the control plane's log to explain it.
  location /v1/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
    # A console session is held open as long as someone has the terminal open.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Everything else -> the Next.js frontend
  location / {
    proxy_pass http://bunk-frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
