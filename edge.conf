map $http_upgrade $conn_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;

  # In-browser console: WebSocket -> control plane
  location /ws/ {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Customer/API traffic -> control plane (direct; no Next rewrite hop)
  location /api/v1/ {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  # Worker onboarding -> control plane: the install wizard (curl | bash), the
  # agent binary it downloads, and the node API (enroll/heartbeat/commands) that
  # an external worker VM calls. Without these an off-host worker install 404s.
  location = /install.sh {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dist/ {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://bf-prod-cp:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  # Everything else -> the Next.js frontend
  location / {
    proxy_pass http://bunk-frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
