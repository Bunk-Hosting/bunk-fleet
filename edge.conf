map $http_upgrade $conn_upgrade { default upgrade; '' close; }

# Docker's eigen DNS, zodat nginx de adressen van de andere containers opnieuw
# opzoekt in plaats van ze bij het opstarten te onthouden. Dat is wat een uitrol
# zonder downtime mogelijk maakt: een vervangen container krijgt een nieuw
# adres, en dit is hoe de edge dat merkt zonder zelf herstart te hoeven worden.
# Een naam in `proxy_pass` wordt alleen opnieuw opgezocht als hij in een
# variabele staat -- vandaar de `set`-regels hieronder.
# `valid=1s` en niet 5: dit is precies zo lang als nginx na een uitrol nog naar
# een container wijst die er niet meer is. Bij vijf seconden was dat meetbaar --
# zes seconden 502 nadat de oude control plane wegging, terwijl de nieuwe al
# antwoordde. Een DNS-vraag aan de resolver van docker, op dezelfde machine,
# kost niets in vergelijking daarmee. Zie ook de herlaad-zet aan het eind van
# deploy-prod.sh, die nginx meteen opnieuw laat kijken in plaats van te wachten.
resolver 127.0.0.11 valid=1s ipv6=off;

# Trust CF-Connecting-IP ONLY when the request actually arrives from a published
# Cloudflare edge address; otherwise a direct client could spoof its IP and defeat
# the control plane's rate-limiting/audit. realip rewrites $remote_addr to the
# verified client IP, which we forward below (never the raw client-supplied header).
#
# De tunnel-hop hoort in deze lijst en stond er niet in. Daardoor deed dit blok
# NIETS: het verkeer komt hier niet binnen vanaf een Cloudflare-adres maar vanaf
# `cloudflared` in LXC 103, en die staat op 192.168.10.2. Elke regel in het
# toegangslog had dus hetzelfde adres -- een browser van een klant, een curl van
# binnen, en de agent van een node, alle drie 192.168.10.2. Gevolg: `limit_req`
# hieronder was geen limiet per IP maar één emmer voor het hele internet
# (inclusief onze eigen agents, die elke twee seconden pollen), en elk audit- en
# beveiligingsspoor in het control plane noteerde de hop in plaats van de klant.
#
# Dat dit veilig is, hangt eraan dat Cloudflare zelf een door de client
# meegestuurde CF-Connecting-IP overschrijft, en dat een machine die nginx
# rechtstreeks aanspreekt een ánder bronadres heeft dan deze ene hop -- voor die
# machine treedt realip dus niet in werking en vervalsen kan ze niets. De
# Cloudflare-ranges blijven staan voor het geval de oorsprong ooit zonder tunnel
# wordt aangesloten.
set_real_ip_from 192.168.10.2/32;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Rate-limit zone for credential/enrollment endpoints (keyed on the verified IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  # Reject oversized bodies before they reach the control plane.
  client_max_body_size 2m;

  # Geen versienummer in de Server-header. Cloudflare herschrijft hem publiek
  # toch naar "cloudflare", dus dit raakt alleen wie de origin rechtstreeks
  # aanspreekt -- en dat is precies degene aan wie we niet hoeven te vertellen
  # welke nginx hier draait.
  server_tokens off;

  # Wie op http:// binnenkomt hoort naar https:// gestuurd te worden, en dat
  # gebeurde niet: `http://app.bunkhosting.nl/login` gaf gewoon 200 met het hele
  # inlogscherm in leesbare tekst. Het hoofddomein doet het wel, dit domein niet.
  #
  # Waarom dat erger is dan het lijkt: HSTS staat er wél, maar HSTS geldt pas
  # nádat een browser het domein één keer over https heeft gezien. Juist die
  # eerste keer is de keer die telt. Iemand op hetzelfde wifi-netwerk als de
  # klant ziet dan het loginscherm langskomen en kan het vervangen door het zijne,
  # vóórdat er enige CSP of HSTS geldt.
  #
  # De tunnel spreekt http met deze nginx, dus `$scheme` is hier altijd http en
  # zegt niets over wat de klant gebruikte. Dat staat in CF-Visitor, een header
  # die Cloudflare zelf zet en die letterlijk het schema van de klant bevat.
  #
  # Bewust CF-Visitor en niet X-Forwarded-Proto. Niet omdat die laatste fout is,
  # maar om wat er gebeurt als ik me vergis: zou X-Forwarded-Proto hier altijd
  # "http" blijken te zijn (de tunnel praat immers http met ons), dan stuurt deze
  # regel élk verzoek door naar https en draait de browser in een lus. CF-Visitor
  # kan alleen "http" zeggen als de klant ook echt http gebruikte. Klopt mijn
  # aanname over de header niet, dan gebeurt er hier niets en is het precies zoals
  # het gisteren was -- een foutmodus die niemand omver duwt.
  #
  # Dit hoort ook aan de Cloudflare-kant te staan ("Always Use HTTPS"), zodat het
  # verzoek onze machine niet eens bereikt. Hier staat het omdat een instelling in
  # andermans paneel niet in deze repo te zien is en stilletjes uit kan staan.
  if ($http_cf_visitor ~ '"scheme":"http"') {
    return 301 https://$host$request_uri;
  }

  # Defence-in-depth security headers (the app also sets its own on HTML routes).
  # Security headers live here and only here. They used to be set twice — once
  # by nginx and once by next.config.mjs — which is how a policy drifts: you
  # change one, the other keeps answering. The edge is the single ingress for
  # both the app and the API, so it is the only layer that can cover everything;
  # Next now sets nothing but the CSP, which is HTML-specific.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # In-browser console: WebSocket -> control plane
  # `proxy_set_header CF-Connecting-IP $remote_addr` staat hieronder in ELKE
  # locatie, en dat is geen slordigheid. Het staat er omdat nginx deze regels per
  # niveau erft en niet per regel: zodra een locatie zelf één proxy_set_header
  # zet, vervallen álle geërfde. Hem één keer op serverniveau zetten zou dus
  # betekenen dat precies de locaties die andere headers nodig hebben (de
  # websockets) hem kwijtraken -- stil, en pas merkbaar als iemand zich afvraagt
  # waarom de ratelimiet daar niet werkt.
  #
  # Waarom hij overal moet staan: hij OVERSCHRIJFT wat de client zelf meestuurde.
  # Ontbreekt hij, dan komt een zelfverzonnen CF-Connecting-IP ongefilterd bij
  # Phoenix aan, en dat is het adres waarop geknepen en geteld wordt.

  # `bunk-cp-live` is een alias en geen containernaam. Tijdens een uitrol staan
  # er twee control planes naast elkaar en wijst de alias naar allebei; zodra de
  # oude netjes gestopt is, alleen nog naar de nieuwe. Met de containernaam was
  # er een gat van twaalf tot achtentwintig seconden waarin hier niets achter
  # zat -- gemeten, niet vermoed.
  location /ws/ {
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Customer/API traffic -> control plane (direct; no Next rewrite hop)
  location /api/v1/ {
    limit_req zone=auth burst=20 nodelay;
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }

  # Worker onboarding -> control plane: the install wizard (curl | bash), the
  # agent binary it downloads, and the node API (enroll/heartbeat/commands) that
  # an external worker VM calls. Without these an off-host worker install 404s.
  location = /install.sh {
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }

  # Zet de automatische updater op een node die al draait. Exact match, net als
  # /install.sh: alles wat hier niet bij naam staat gaat naar de frontend en zou
  # een 404 opleveren op een pad dat met `curl | sh` wordt aangeroepen.
  location = /agent-update.sh {
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }

  # Waar een beveiligingsonderzoeker zijn vondst kwijt kan (RFC 9116). Exact
  # match, net als /install.sh: alles wat hier niet bij naam staat gaat naar de
  # frontend, en die kent dit pad niet.
  # Gezondheidscontrole voor een watchdog buiten deze machine.
  location = /healthz {
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Kort: een watchdog die dertig seconden wacht meet niet of het werkt maar
    # of het traag is, en dat is een andere vraag.
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    access_log off;
  }

  location = /.well-known/security.txt {
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }

  location /dist/ {
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }

  # Node API: enrol, heartbeat, command poll — and the console relay, which is a
  # WebSocket, so this location has to carry the upgrade through. Without the two
  # Upgrade headers the agent's dial-back gets a 400 and every console on a remote
  # node fails with nothing in the control plane's log to explain it.
  location /v1/ {
    limit_req zone=auth burst=20 nodelay;
    set $cp bunk-cp-live:4000;
    proxy_pass http://$cp;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
    # A console session is held open as long as someone has the terminal open.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Everything else -> the Next.js frontend
  #
  # Op de alias en niet op de containernaam: tijdens een uitrol dragen de oude
  # en de nieuwe frontend allebei `bunk-frontend-live`, zodat er geen moment is
  # waarop de naam nergens heen wijst. Zodra de oude netjes is gestopt blijft
  # alleen de nieuwe over.
  location / {
    set $fe bunk-frontend-live:3000;
    proxy_pass http://$fe;
    # Een adres dat net is verdwenen is geen fout van de bezoeker: achter de
    # alias staat er nog een, en daar mag hij heen.
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }
}
